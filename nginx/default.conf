server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Directory listing — handy for debugging, disable in production if desired
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optimise delivery of large boot images (WIM, ISO, IMG)
    location ~* \.(wim|iso|img|gz)$ {
        sendfile on;
        tcp_nopush on;
        tcp_nodelay off;
    }
}
